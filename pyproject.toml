[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ReinFlow"
version = "1.0.0"
description = "Fine-tuning flow matching policies with policy gradient."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "av",
    "einops",
    "gdown",
    "gym",
    "hydra-core",
    "imageio",
    "matplotlib",
    "omegaconf",
    "pretty_errors",
    "torch>=2.4.0",
    "tqdm",
    "wandb",
    "pandas==2.0.3",
    "pypdf>=3.9.0",
    "seaborn"
]

[project.optional-dependencies]
gym = [
    "cython<3",
    "d4rl",
    "patchelf",
]
kitchen = [
    "cython<3",
    "d4rl",
    "dm_control==1.0.16",   
    "mujoco==3.1.6",
    "patchelf",
]
robomimic = [
    "cython<3",
    "d4rl",
    "patchelf",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git",
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@v1.4.1",
]
d3il = [
    "cython<3",
    "d4rl",
    "gin-config",
    "patchelf",
    "pin",
]
furniture = [
    "cython<3",
    "d4rl",
    "ipdb==0.13.13",
    "patchelf",
]
exact = [   # exact likelihood
    "torchdiffeq",
]
all = [
    "cython<3",
    "d4rl",
    "gin-config",
    "ipdb==0.13.13",
    "patchelf",
    "pin",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git",
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@v1.4.1",
]

[project.urls]
Homepage = "https://reinflow.github.io/"

[tool.setuptools.packages.find]
exclude = ['src']

[tool.wheel]
exclude = []
